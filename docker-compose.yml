services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendor_guardian
      POSTGRES_USER: vendor_guardian
      POSTGRES_PASSWORD: vendor_guardian
    ports:
      - "5432:5432"
    volumes:
      - vendor_guardian_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendor_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - vendor_guardian_redis:/data

volumes:
  vendor_guardian_postgres:
  vendor_guardian_redis:
